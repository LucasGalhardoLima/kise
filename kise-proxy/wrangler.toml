name = "kise-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat_v2"]

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]

[triggers]
crons = ["0 14 * * *"]

[[kv_namespaces]]
binding = "DAILY_PICK"
id = "654bc8166fec4e138af946546a7c8c62"

[vars]
ADMIN_EMAIL = "lucas.galhardo.lima@pm.me"
# ANTHROPIC_API_KEY set via `wrangler secret put ANTHROPIC_API_KEY`
# OPENWEATHER_API_KEY set via `wrangler secret put OPENWEATHER_API_KEY`
# RESEND_API_KEY set via `wrangler secret put RESEND_API_KEY`
