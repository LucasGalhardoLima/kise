<!--
  Subject line variants (rotate daily):
    pt-BR:
      - "Kise's Pick: {{paletteName}}"
      - "As cores de hoje: {{paletteName}}"
      - "{{paletteName}} — a paleta do dia"
      - "O que vestir hoje? {{paletteName}}"
    en:
      - "Kise's Pick: {{paletteName}}"
      - "Today's colors: {{paletteName}}"
      - "{{paletteName}} — your daily palette"
      - "What to wear today? {{paletteName}}"
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"></head>
<body style="margin:0;padding:0;background-color:#F5F3EF;font-family:'DM Sans',Helvetica,Arial,sans-serif">
  <div style="display:none;visibility:hidden;opacity:0;color:transparent;height:0;width:0;overflow:hidden;mso-hide:all;max-height:0;max-width:0;font-size:1px;line-height:1px">
    {{preheader}}&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;
  </div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F3EF">
    <tr><td align="center" style="padding:40px 20px">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%">
        <!-- Logo -->
        <tr><td align="center" style="padding-bottom:12px">
          <span style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:14px;color:#9B9B9B;letter-spacing:0.15em;text-transform:uppercase">KISE'S PICK</span>
        </td></tr>

        <!-- Palette name -->
        <tr><td align="center" style="padding-bottom:8px">
          <span style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:28px;color:#344E41">{{paletteName}}</span>
        </td></tr>

        <!-- City + weather -->
        <tr><td align="center" style="padding-bottom:32px">
          <span style="font-size:13px;color:#6B6B6B">{{city}} · {{temperature}}°C · {{condition}}</span>
        </td></tr>

        <!-- Color swatches -->
        <tr><td align="center" style="padding-bottom:12px">
          <!--[if mso]><table role="presentation" cellpadding="0" cellspacing="0"><tr><![endif]-->
          {{#each colors}}
          <div style="display:inline-block;width:56px;height:56px;background:{{this}};margin:0 2px;border-radius:4px"></div>
          {{/each}}
          <!--[if mso]></tr></table><![endif]-->
        </td></tr>

        <!-- Hex codes -->
        <tr><td align="center" style="padding-bottom:32px">
          <span style="font-size:11px;color:#9B9B9B;letter-spacing:0.08em">{{hexCodes}}</span>
        </td></tr>

        <!-- Description -->
        <tr><td style="padding-bottom:32px">
          <p style="margin:0;font-size:14px;line-height:1.7;color:#6B6B6B;text-align:center">{{description}}</p>
        </td></tr>

        <!-- Divider -->
        <tr><td align="center" style="padding:16px 0 32px">
          <div style="width:60px;height:1px;background-color:#A3B18A;opacity:0.4"></div>
        </td></tr>

        <!-- Footer -->
        <tr><td align="center">
          <span style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:18px;color:#344E41">KISE 着せ</span>
          <p style="margin:8px 0 0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:14px;color:#9B9B9B;font-style:italic">Vista com intenção.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
