name: KISE
options:
  bundleIdPrefix: com.kise
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 5

targets:
  KISE:
    type: application
    platform: iOS
    sources:
      - path: KISE/Sources
      - path: KISE/Assets.xcassets
      - path: KISE/Preview Content
      - path: KISE/Localizable.xcstrings
    settings:
      base:
        INFOPLIST_FILE: KISE/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.kise.app
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: KISE/KISE.entitlements
      properties:
        com.apple.developer.weatherkit: true

  KISETests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KISE/Tests
    dependencies:
      - target: KISE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kise.app.tests
        GENERATE_INFOPLIST_FILE: YES
